# /etc/restic/backup.conf on the UberSDR box (192.168.1.109). Deployed by restic/deploy.sh.
HOST_LABEL="ubersdr (192.168.1.109)"
RESTIC_REPOSITORY="rclone:nas:/Backups/restic/ubersdr"
BACKUP_PATHS="/ /boot/efi"
EXCLUDE_FILES="/etc/restic/exclude-common.txt /etc/restic/exclude-host.txt"
# MariaDB containers to dump before the backup (live data dir excluded in exclude-host.txt)
DB_DUMPS="wavelog-trial-db"
# 01:30 IST — before UrBackup (02:56+) and the Mac's 03:30 NAS push. Read by deploy.sh for the timer.
ONCALENDAR="*-*-* 01:30:00"
# Low priority: radiod/UberSDR are real-time and must not be starved.
GOMAXPROCS=2
