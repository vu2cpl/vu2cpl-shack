# /etc/restic/backup.conf on macmini-server. Deployed by restic/deploy.sh.
HOST_LABEL="macmini-server"
RESTIC_REPOSITORY="rclone:nas:/Backups/restic/macmini-server"
BACKUP_PATHS="/ /boot /boot/efi /mnt/immich"
EXCLUDE_FILES="/etc/restic/exclude-common.txt /etc/restic/exclude-host.txt"
DB_DUMPS="alpa-replica-db-1"
# Immich dumps its own DB at 02:00 into the library; the live postgres dir is excluded.
IMMICH_DUMP_DIR="/mnt/immich/backups"
# 03:00 IST — after the Immich DB dump (02:00) and the ALPA backup (02:30).
ONCALENDAR="*-*-* 03:00:00"
GOMAXPROCS=2
