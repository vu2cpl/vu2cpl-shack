# rclone remote used by restic's rclone: backend — installed as /etc/restic/rclone.conf by deploy.sh.
# Why rclone and not restic's native sftp: the Synology (DS710+, DSM 5.2) SFTP server fails the
# chmod restic issues on every new file ("Chmod ...: file does not exist"); rclone's sftp backend
# doesn't do it. No secrets here — the key file stays on the box.
[nas]
type = sftp
host = 192.168.1.101
user = admin
key_file = /root/.ssh/restic_nas
known_hosts_file = /root/.ssh/known_hosts
set_modtime = false
shell_type = none
md5sum_command = none
sha1sum_command = none
